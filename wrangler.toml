# Online play: `npx wrangler dev` runs it locally (http://localhost:8787); `npx wrangler deploy` publishes it.
name = "firecraft"
main = "server/worker.js"
compatibility_date = "2026-09-01"

# The game's static files are served straight from the repo root (see .assetsignore).
[assets]
directory = "."

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]

# Test server: `npx wrangler deploy --env test` publishes a separate Worker, firecraft-test, with its
# own database, at https://firecraft-test.emberworks.workers.dev. Run smoke tests here, not on the live one.
[env.test]
name = "firecraft-test"

[[env.test.durable_objects.bindings]]
name = "WORLD"
class_name = "World"
